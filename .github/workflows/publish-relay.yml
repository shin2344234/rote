name: Build and publish relay image

# The Docker host runs Watchtower, which pulls a new latest tag within a minute
# and restarts rote-relay with it. Only changes to the relay start a build.
on:
  push:
    branches:
      - main
    paths:
      - relay/**
      - .github/workflows/publish-relay.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-relay
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/shin2344234/rote-relay

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # The image gets built and tried before anything is published, so a relay
      # that fails to start never reaches the host.
      - name: Build image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: relay
          load: true
          tags: rote-relay:ci
          cache-from: type=gha

      # Runs the container the way compose.yaml does: read-only, no capabilities,
      # and a fresh named volume at /data, so the counts file must be writable there.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker volume create relay-ci-data >/dev/null
          docker run -d --name relay-ci -p 8787:8787 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v relay-ci-data:/data rote-relay:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ -o /tmp/home.html 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "::error::relay did not start"; docker logs relay-ci; exit 1; fi
          grep -q "Rote" /tmp/home.html || { echo "::error::home page missing"; exit 1; }

          browser='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/142.0 Safari/537.36'
          for path in /privacy /next/load /next/reload; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$browser" "http://127.0.0.1:8787$path")
            [ "$code" = 200 ] || { echo "::error::$path returned $code"; docker logs relay-ci; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$browser" http://127.0.0.1:8787/download)
          [ "$code" = 302 ] || { echo "::error::/download returned $code"; exit 1; }

          docker exec relay-ci cat /data/counts.json > /tmp/counts.json || {
            echo "::error::counts.json was not written"; docker logs relay-ci; exit 1; }
          cat /tmp/counts.json
          for name in install update download; do
            grep -q "\"$name\": 1" /tmp/counts.json || { echo "::error::$name was not counted"; exit 1; }
          done
          if docker logs relay-ci 2>&1 | grep -q "Could not save counts"; then
            echo "::error::relay could not write /data"; docker logs relay-ci; exit 1
          fi

          docker rm -f relay-ci >/dev/null
          docker volume rm relay-ci-data >/dev/null
          echo "Smoke test passed."

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: relay
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
