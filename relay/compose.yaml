# The relay publishes no port. A reverse proxy or tunnel on the same Docker network
# reaches it by name at http://rote-relay:8787.
#
# Run it by hand: copy .env.example to .env, fill it in and run docker compose up -d --build.
# Run it from Portainer: add a stack from this repository with relay/compose.yaml as the
# Compose path, give it the three variables from .env.example, and turn on automatic updates.
# Portainer then pulls main on its polling interval and rebuilds the image when it changed,
# because of pull_policy: build.
services:
  relay:
    build: .
    image: rote-relay:local
    pull_policy: build
    container_name: rote-relay
    restart: unless-stopped
    # Filled from .env by hand, or from the stack's variables in Portainer. Neither is committed.
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
    read_only: true
    # The only writable place. It holds counts.json, the daily download and install totals.
    # Read them with: docker exec rote-relay cat /data/counts.json
    volumes: [data:/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [proxy]

volumes:
  data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to the Docker network your proxy or tunnel is on}
