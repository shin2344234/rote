# The relay publishes no port. A reverse proxy or tunnel on the same Docker network
# reaches it by name at http://rote-relay:8787. Copy .env.example to .env first.
services:
  relay:
    build: .
    # Left alone, compose builds the image from this folder. To follow the published image
    # instead, set IMAGE_NAME=ghcr.io/shin2344234/rote-relay:latest and PULL_POLICY=always
    # in .env. GitHub Actions publishes it on every relay change to main, and a Watchtower
    # started with WATCHTOWER_LABEL_ENABLE=true swaps it in because of the label below.
    image: ${IMAGE_NAME:-rote-relay:local}
    pull_policy: ${PULL_POLICY:-missing}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    container_name: rote-relay
    restart: unless-stopped
    # Holds GITHUB_TOKEN and GITHUB_REPO. The file stays on the host and is never committed.
    env_file: .env
    read_only: true
    # The only writable place. It holds counts.json, the daily download and install totals.
    # Read them with: docker exec rote-relay cat /data/counts.json
    volumes: [data:/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [proxy]

volumes:
  data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env to the Docker network your proxy or tunnel is on}
