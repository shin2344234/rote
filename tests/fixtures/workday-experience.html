<!doctype html>
<meta charset="utf-8">
<title>Workday style work experience</title>
<!-- Workday numbers each block by an internal counter, as in workExperience-8 and workExperience-122. -->
<style>
  .date { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid #888; }
  .date input { width: 1px; height: 1px; padding: 0; border: 0; }
</style>
<form>
  <div data-automation-id="workExperienceSection" id="section">
    <h3>Work Experience</h3>
    <div id="blocks"></div>
    <button type="button" data-automation-id="add-button" id="add">Add Another</button>
  </div>
  <div data-automation-id="skillsSection">
    <h3>Skills</h3>
    <label for="skills--skills">Type to Add Skills</label>
    <div id="skills-box">
      <ul id="pills"></ul>
      <input id="skills--skills" data-automation-id="searchBox" placeholder="Search">
    </div>
  </div>
  <div id="popup"></div>
  <button type="submit" id="submit">Save and Continue</button>
</form>
<script>
  const blocks = document.getElementById('blocks');
  let count = 0;
  const numbers = [8, 122, 136];
  // Workday draws a date as digits in a box, over inputs too small to see, labelled only "Month" and "Year".
  function dateBox(n, which, label) {
    const id = `workExperience-${n}--${which}Date-dateSection`;
    return `<div><span>${label}</span><div class="date">
      <div data-automation-id="dateSectionMonth-display">MM</div><input id="${id}Month-input" role="spinbutton" aria-label="Month">
      <div data-automation-id="dateSectionYear-display">YYYY</div><input id="${id}Year-input" role="spinbutton" aria-label="Year">
    </div></div>`;
  }
  function addBlock() {
    count++;
    const n = numbers[count - 1];
    const block = document.createElement('div');
    block.setAttribute('role', 'group');
    block.setAttribute('aria-labelledby', `heading-${n}`);
    block.innerHTML = `<h4 id="heading-${n}">Professional Experience ${count}</h4>
      <div><label for="workExperience-${n}--jobTitle">Job Title</label><input id="workExperience-${n}--jobTitle" name="jobTitle"></div>
      <div><label for="workExperience-${n}--companyName">Company</label><input id="workExperience-${n}--companyName" name="companyName"></div>
      <div><label for="workExperience-${n}--location">Location</label><input id="workExperience-${n}--location" name="location"></div>
      <div><input type="checkbox" id="workExperience-${n}--currentlyWorkHere" name="currentlyWorkHere"><span>I currently work here</span></div>
      ${dateBox(n, 'start', 'From')}${dateBox(n, 'end', 'To')}`;
    blocks.appendChild(block);
  }
  // Workday keeps its own copy of each value and only takes the typed text when the field loses focus.
  // It then draws the field again as a new element with the same id.
  window.saved = {};
  // A date box takes one typed digit at a time into the display beside it and empties itself.
  // A whole value set at once is ignored. Two month digits move focus on to the year.
  blocks.addEventListener('input', (event) => {
    const input = event.target;
    const part = input.id.match(/dateSection(Month|Year)-input$/)?.[1];
    if (!part) return;
    const display = input.parentElement.querySelector(`[data-automation-id="dateSection${part}-display"]`);
    if (event.data && /^[0-9]$/.test(event.data)) {
      const digits = /^[0-9]+$/.test(display.textContent) && display.textContent.length < (part === 'Month' ? 2 : 4) ? display.textContent : '';
      display.textContent = digits + event.data;
      window.saved[input.id] = display.textContent;
      if (part === 'Month' && display.textContent.length === 2) input.parentElement.querySelector('[id$="dateSectionYear-input"]').focus();
    }
    input.value = '';
  });
  blocks.addEventListener('focusout', (event) => {
    const input = event.target;
    if (!input.id || input.type === 'checkbox' || /dateSection/.test(input.id)) return;
    window.saved[input.id] = input.value;
    setTimeout(() => {
      if (!input.isConnected) return;
      const fresh = input.cloneNode(true);
      fresh.value = input.value;
      input.replaceWith(fresh);
    }, 0);
  });
  // Workday's Skills picker searches only on Enter and offers loose matches. Each result has a checkbox,
  // and only ticking it adds the skill. Clicking the row itself does nothing. The search box empties on
  // blur, so typed text alone never sticks. Picked skills show as pills that Workday also marks as
  // prompt options inside menu items. The picker names few skills the way a resume does.
  const CATALOG = ['TypeScript', 'Python Scripting', 'Python (Programming Language)', 'MySQL', 'JavaScript'];
  const skillsInput = document.getElementById('skills--skills');
  const pills = document.getElementById('pills');
  const popup = document.getElementById('popup');
  window.skills = [];
  function drawPills() {
    pills.innerHTML = window.skills.map((skill) => `<li data-automation-id="menuItem"><div data-automation-id="selectedItem"><div data-automation-id="promptOption" role="option" data-automation-label="${skill}">${skill}</div></div><span data-automation-id="DELETE_charm" role="button" aria-label="Delete ${skill}">x</span></li>`).join('');
    pills.querySelectorAll('[data-automation-id="DELETE_charm"]').forEach((charm, index) => charm.addEventListener('click', () => {
      window.skills.splice(index, 1);
      drawPills();
    }));
  }
  function search(query) {
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    const found = CATALOG.filter((skill) => words.some((word) => skill.toLowerCase().includes(word)));
    setTimeout(() => {
      // Like Workday, the first result is the one the keyboard highlights.
      popup.innerHTML = found.map((skill, index) => `<div data-automation-id="menuItem" role="option" aria-selected="${index === 0}"><div data-automation-id="promptLeafNode" data-automation-checked="${window.skills.includes(skill) ? 'Checked' : 'NotChecked'}"><input type="checkbox" data-automation-id="checkboxPanel"${window.skills.includes(skill) ? ' checked' : ''}><div data-automation-id="promptOption" data-automation-label="${skill}">${skill}</div></div></div>`).join('');
      popup.querySelectorAll('input[data-automation-id="checkboxPanel"]').forEach((box, index) => box.addEventListener('click', () => {
        const skill = found[index];
        if (box.checked && !window.skills.includes(skill)) window.skills.push(skill);
        if (!box.checked) window.skills = window.skills.filter((other) => other !== skill);
        box.closest('[data-automation-id="promptLeafNode"]').dataset.automationChecked = box.checked ? 'Checked' : 'NotChecked';
        drawPills();
      }));
    }, 600);
  }
  // Typing empties the results until Enter brings the new ones, 600 ms later.
  skillsInput.addEventListener('input', () => { popup.innerHTML = ''; });
  skillsInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') search(skillsInput.value);
    if (event.key === 'Escape') popup.innerHTML = '';
  });
  skillsInput.addEventListener('blur', () => { skillsInput.value = ''; });
  addBlock();
  document.getElementById('add').addEventListener('click', () => setTimeout(addBlock, 50));
  document.querySelector('form').addEventListener('submit', (event) => {
    event.preventDefault();
    document.body.dataset.submitted = 'yes';
  });
</script>
