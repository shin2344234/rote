<!doctype html>
<meta charset="utf-8">
<title>Education block with a styled title</title>
<form>
  <div class="contact">
    <h3>Phone</h3>
    <label for="phone">Phone</label><input id="phone">
  </div>
  <div class="education--form">
    <div class="education--header"><p>Education</p></div>
    <div class="select"><label for="school--0">School</label><input id="school--0"></div>
    <div class="select"><label for="degree--0">Degree</label><input id="degree--0"></div>
    <div class="select"><label for="discipline--0">Discipline</label><input id="discipline--0"></div>
    <div class="select"><label for="start-month--0">Start date month</label><select id="start-month--0"><option value="">Select</option><option>January</option><option>September</option></select></div>
    <div class="year"><label for="start-year--0">Start date year</label><input id="start-year--0" type="number"></div>
    <div class="select"><label for="end-month--0">End date month</label><select id="end-month--0"><option value="">Select</option><option>May</option></select></div>
    <div class="year"><label for="end-year--0">End date year</label><input id="end-year--0" type="number"></div>
  </div>
</form>
