<!doctype html>
<meta charset="utf-8">
<title>Employment block with an add another button</title>
<form>
  <div class="field"><label for="first_name">First Name</label><input id="first_name"></div>
  <div class="field"><label for="last_name">Last Name</label><input id="last_name"></div>
  <div class="field"><label for="candidate-location">Location (City)</label><input id="candidate-location" role="combobox" aria-controls="places" autocomplete="off"><ul id="places" role="listbox" hidden></ul></div>
  <div class="employment--container" id="blocks">
    <button class="add-another-button" type="button" id="add-employment">Add another</button>
  </div>
  <div class="education--container">
    <div class="education--form"><hr><div class="education--header"><p>Education</p></div>
      <div class="field"><label for="school--0">School</label><input id="school--0"></div>
    </div>
    <button class="add-another-button" type="button" id="add-education">Add another</button>
  </div>
  <div class="field"><label for="question_1">What is your legal first name?</label><input id="question_1"></div>
  <div class="field"><label for="question_2">What is your legal last name?</label><input id="question_2"></div>
  <button type="submit" id="submit">Submit application</button>
</form>
<script>
  const blocks = document.getElementById('blocks');
  let next = 0;
  function addBlock() {
    const i = next++;
    const block = document.createElement('div');
    block.className = 'employment-form';
    block.innerHTML = `<hr><div class="header-row"><p>Employment</p>${i ? '<button type="button" aria-label="Remove employment">x</button>' : ''}</div>
      <div class="field"><label for="company-name-${i}">Company name</label><input id="company-name-${i}"></div>
      <div class="field"><label for="title-${i}">Title</label><input id="title-${i}"></div>
      <div class="date-row"><div class="field"><label for="start-date-month-${i}">Start date month</label><input id="start-date-month-${i}" role="combobox" aria-controls="start-months-${i}" autocomplete="off" placeholder="Select..."><ul id="start-months-${i}" role="listbox" hidden></ul></div>
      <div class="field"><label for="start-date-year-${i}">Start date year</label><input id="start-date-year-${i}" type="number"></div></div>
      <div class="date-row"><div class="field"><label for="end-date-month-${i}">End date month</label><select id="end-date-month-${i}"><option value="">Select</option><option>January</option><option>March</option><option>December</option></select></div>
      <div class="field"><label for="end-date-year-${i}">End date year</label><input id="end-date-year-${i}" type="number"></div></div>
      <div class="field"><input type="checkbox" id="current-role-${i}_1" name="current-role-${i}"><label for="current-role-${i}_1">Current role</label></div>`;
    blocks.insertBefore(block, document.getElementById('add-employment'));
    wireCombo(document.getElementById(`start-date-month-${i}`), document.getElementById(`start-months-${i}`), MONTHS);
  }
  // Greenhouse month fields are searchable lists that open on click and drop unpicked text on blur.
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function wireCombo(input, list, items) {
    const show = () => {
      const q = input.value.toLowerCase().split(',')[0].trim();
      list.innerHTML = '';
      items.filter((item) => !q || item.toLowerCase().startsWith(q)).forEach((item) => { const li = document.createElement('li'); li.setAttribute('role', 'option'); li.textContent = item; li.addEventListener('mousedown', (event) => event.preventDefault()); li.addEventListener('click', () => { input.value = item; input.dataset.picked = item; list.hidden = true; }); list.appendChild(li); });
      list.hidden = !list.children.length;
    };
    input.addEventListener('input', show);
    input.addEventListener('click', show);
    input.addEventListener('blur', () => setTimeout(() => { if (input.value !== input.dataset.picked) input.value = ''; list.hidden = true; }, 0));
  }
  addBlock();
  document.getElementById('add-education').addEventListener('click', () => { document.body.dataset.education = 'added'; });
  // Lists only its own places and clears anything else on blur, like Greenhouse.
  const place = document.getElementById('candidate-location');
  const list = document.getElementById('places');
  const PLACES = ['Austin County, Texas, United States', 'Austin, Minnesota, United States', 'Austin, Texas, United States'];
  place.addEventListener('input', () => {
    const q = place.value.toLowerCase().split(',')[0].trim();
    list.innerHTML = '';
    PLACES.filter((p) => q && p.toLowerCase().startsWith(q)).forEach((p) => { const li = document.createElement('li'); li.setAttribute('role', 'option'); li.textContent = p; li.addEventListener('click', () => { place.value = p; place.dataset.picked = p; list.hidden = true; }); list.appendChild(li); });
    list.hidden = !list.children.length;
  });
  place.addEventListener('blur', () => setTimeout(() => { if (place.value !== place.dataset.picked) place.value = ''; }, 0));
  document.getElementById('add-employment').addEventListener('click', () => setTimeout(addBlock, 50));
  document.querySelector('form').addEventListener('submit', (event) => {
    event.preventDefault();
    document.body.dataset.submitted = 'yes';
  });
</script>
